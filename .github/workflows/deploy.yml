name: deploy
# Push-to-deploy for etherhive.vaked.dev (CF Pages project "etherhive-vaked-dev").
# Static single-file site — the site directory is assembled fresh and uploaded
# as-is, no build step. Nothing internal ever ships: only the files listed here.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7 # v4
        with:
          node-version: 24

      - name: assemble
        run: |
          rm -rf _site && mkdir -p _site/.well-known
          cp index.html 404.html favicon.svg robots.txt site.webmanifest llms.txt _headers _site/
          cp icon-192.png icon-512.png apple-touch-icon.png og-image.png og-image.svg _site/
          cp .well-known/agents.md .well-known/security.txt _site/.well-known/

      - name: deploy to Cloudflare Pages
        run: |
          npm i -g wrangler@3
          wrangler pages deploy _site --project-name=etherhive-vaked-dev --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
